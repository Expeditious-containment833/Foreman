<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Foreman OG card source</title>
<!--
  Source for og.png. Render at exactly 1200x630 and save as docs/og.png.

  Regenerate with any Chromium browser:
    "/Applications/Brave Browser.app/Contents/MacOS/Brave Browser" \
      --headless --disable-gpu --hide-scrollbars \
      --window-size=1200,630 --screenshot=docs/og.png \
      docs/og.html
-->
<style>
  @font-face { font-family: x; src: local("system-ui"); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0E1116;
    color: #E6EDF3;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px 80px;
    position: relative;
  }
  .rule { position: absolute; left: 0; top: 0; width: 100%; height: 6px; background: #FFB400; }
  .eyebrow {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 19px; letter-spacing: .22em; text-transform: uppercase; color: #8B949E;
  }
  h1 {
    font-size: 92px; line-height: 1.03; letter-spacing: -0.035em; font-weight: 660;
    max-width: 17ch; margin: 26px 0 0;
  }
  h1 span { color: #FFB400; }
  .sub { font-size: 27px; color: #8B949E; margin-top: 26px; max-width: 40ch; line-height: 1.45; }
  footer { display: flex; align-items: center; justify-content: space-between; }
  .mark { display: flex; align-items: center; gap: 14px; font-size: 25px; font-weight: 640; }
  .by { font-size: 22px; color: #8B949E; }
  .by b { color: #E6EDF3; font-weight: 600; }
</style>
</head>
<body>
  <div class="rule"></div>

  <div>
    <p class="eyebrow">A build playbook for coding agents</p>
    <h1>Your agent's ceiling is your&nbsp;<span>brief</span>.</h1>
    <p class="sub">It interviews you, forces the decisions, locks a visual system, then verifies, ships, and indexes the site.</p>
  </div>

  <footer>
    <div class="mark">
      <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="5" fill="#161B22"></rect>
        <path d="M9 23V9h14v3.4h-10.4v2.9H21v3.4h-8.4V23z" fill="#FFB400"></path>
      </svg>
      Foreman
    </div>
    <p class="by">by <b>Turki Alshuaibi</b> · github.com/Turki-Sh/Foreman</p>
  </footer>
</body>
</html>
