<style>
  @font-face {
    font-family: "Barlow Condensed";
    src: url("/Foreman/fonts/barlow-condensed-700.woff2") format("woff2");
    font-weight: 700; font-style: normal; font-display: swap;
  }
  :root[data-theme="dark"] {
    --paper: #0A2444; --ink: #EAF1FA; --muted: #93AECD;
    --blue: #7FA8DC; --tint: #143A66; --hair: #1B3D6B;
  }
  :root {
    --paper: #FFFFFF; --ink: #0A0A0A; --muted: #767676;
    --blue: #1B4DD1; --tint: #DDE5FA; --hair: #E4E4E4;
    --display: "Barlow Condensed", "Arial Narrow", "Avenir Next Condensed", system-ui, sans-serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: var(--ink) var(--paper); scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 13px; }
  ::-webkit-scrollbar-track { background: var(--paper); border-left: 1px solid var(--hair); }
  ::-webkit-scrollbar-thumb { background: var(--ink); border: 4px solid var(--paper); }
  ::selection { background: var(--tint); color: var(--ink); }
  body {
    margin: 0; min-height: 100dvh; background: var(--paper); color: var(--ink);
    font-family: var(--body); line-height: 1.6;
    display: grid; place-items: center; padding: 1.75rem;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 46ch; width: 100%; }
  .boxlbl {
    display: inline-block; border: 1px solid var(--ink); padding: .3rem .55rem;
    font-family: var(--mono); font-size: .6875rem; letter-spacing: .12em; text-transform: uppercase;
  }
  h1 {
    font-family: var(--display); font-weight: 700; text-transform: uppercase;
    font-size: clamp(2.4rem, 8vw, 4rem); line-height: .9; letter-spacing: -.005em;
    margin: 1rem 0 .75rem;
  }
  p { color: var(--muted); margin: 0 0 1.75rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .55rem; }
  a.btn {
    display: inline-block; font-family: var(--mono); font-size: .75rem;
    letter-spacing: .1em; text-transform: uppercase; text-decoration: none;
    padding: .8rem 1.2rem; background: var(--ink); color: var(--paper);
    border: 1px solid var(--ink); transition: background .16s ease, color .16s ease;
  }
  a.btn:hover { background: var(--blue); border-color: var(--blue); }
  a.btn.o { background: transparent; color: var(--ink); }
  a.btn.o:hover { background: var(--ink); color: var(--paper); }
  a.btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  .rule { margin-top: 2.25rem; padding-top: .875rem; border-top: 1px solid var(--hair);
          font-family: var(--mono); font-size: .6875rem; letter-spacing: .1em;
          text-transform: uppercase; color: var(--muted); }

  /* Drafting paper, same as the OG card. Barely visible, does the work. */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--gridB) 1px, transparent 1px),
      linear-gradient(90deg, var(--gridB) 1px, transparent 1px),
      linear-gradient(var(--gridA) 1px, transparent 1px),
      linear-gradient(90deg, var(--gridA) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  }
  :root { --gridA: rgba(27,77,209,.055); --gridB: rgba(27,77,209,.13); }
  :root[data-theme="dark"] { --gridA: rgba(127,168,220,.07); --gridB: rgba(127,168,220,.15); }

  /* The sheet, torn. It runs off the right edge and stops mid-drawing, which is
     the whole idea: you asked for a page that is not in the set. */
  .torn {
    position: fixed; z-index: 0; pointer-events: none;
    right: 0; top: 50%; transform: translateY(-50%);
    width: min(46vw, 30rem); opacity: .9;
  }
  .torn svg { display: block; width: 100%; height: auto; }
  .torn .ln { stroke: var(--blue); fill: none; stroke-linecap: round; opacity: .75; }
  .torn .frame { stroke: var(--ink); opacity: .55; }
  .torn .edge { stroke: var(--ink); opacity: .4; stroke-dasharray: 2 5; }
  main { position: relative; z-index: 1; }

  @media (max-width: 52rem) { .torn { display: none; } }
  /* Reserve the sheet's column so the text centres in what is left of the page
     rather than running underneath the drawing. */
  @media (min-width: 52.01rem) { body { padding-right: min(48vw, 33rem); } }
</style>
</head>
<body>
<script>
  // Carry the reader's chosen theme across pages, before first paint.
  try {
    if (localStorage.getItem('foreman-theme') === 'dark') {
      document.documentElement.dataset.theme = 'dark';
      document.querySelector('meta[name="theme-color"]').content = '#0A2444';
    }
  } catch (e) {}
</script>
<div class="torn" aria-hidden="true">
  <svg viewBox="0 0 400 340" fill="none">
    <defs>
      <filter id="rough" x="-6%" y="-6%" width="112%" height="112%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="9" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- everything past the tear is clipped away -->
      <clipPath id="tear">
        <path d="M0 0 H286 L272 32 L292 66 L268 104 L290 146 L266 188 L288 232 L270 274 L286 306 L272 340 H0 Z"/>
      </clipPath>
    </defs>

    <g clip-path="url(#tear)">
      <g filter="url(#rough)">
        <path class="ln frame" stroke-width="2" d="M34 22 L360 18 L364 322 L32 326 Z"/>
        <path class="ln" stroke-width="1.5" d="M34 60 C 130 62, 260 58, 360 57"/>
        <path class="ln" stroke-width="1.7" d="M60 96 L214 94"/>
        <path class="ln" stroke-width="1.7" d="M60 118 L268 116"/>
        <path class="ln" stroke-width="1.7" d="M60 140 L172 139"/>
        <path class="ln" stroke-width="1.7" d="M60 176 L146 176 L146 206 L60 206 Z"/>
        <path class="ln" stroke-width="1.5" d="M60 244 L300 241"/>
        <path class="ln" stroke-width="1.5" d="M60 266 L236 264"/>
      </g>
    </g>

    <!-- the torn edge itself -->
    <path class="ln edge" stroke-width="1.4"
          d="M286 0 L272 32 L292 66 L268 104 L290 146 L266 188 L288 232 L270 274 L286 306 L272 340"/>
  </svg>
</div>

<main>
  <span class="boxlbl">Error 404</span>
  <h1>That sheet isn't in the set.</h1>
  <p>The link may be old, or the address may have a typo in it. Everything else is still where it was.</p>
  <div class="actions">
    <a class="btn" href="/Foreman/">Back to Foreman</a>
    <a class="btn o" href="https://github.com/Turki-Sh/Foreman">The repository</a>
  </div>
  <p class="rule">Foreman · Blueprint no. 1 · T. Alshuaibi · MIT</p>
</main>
</body>
</html>
