<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Foreman</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/Foreman/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/Foreman/icon-180.png">
<link rel="preload" href="/Foreman/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Barlow Condensed";
    src: url("/Foreman/fonts/barlow-condensed-700.woff2") format("woff2");
    font-weight: 700; font-style: normal; font-display: swap;
  }
  :root[data-theme="dark"] {
    --paper: #0A2444; --ink: #EAF1FA; --muted: #93AECD;
    --blue: #7FA8DC; --tint: #143A66; --hair: #1B3D6B;
  }
  :root {
    --paper: #FFFFFF; --ink: #0A0A0A; --muted: #767676;
    --blue: #1B4DD1; --tint: #DDE5FA; --hair: #E4E4E4;
    --display: "Barlow Condensed", "Arial Narrow", "Avenir Next Condensed", system-ui, sans-serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: var(--ink) var(--paper); scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 13px; }
  ::-webkit-scrollbar-track { background: var(--paper); border-left: 1px solid var(--hair); }
  ::-webkit-scrollbar-thumb { background: var(--ink); border: 4px solid var(--paper); }
  ::selection { background: var(--tint); color: var(--ink); }
  body {
    margin: 0; min-height: 100dvh; background: var(--paper); color: var(--ink);
    font-family: var(--body); line-height: 1.6;
    display: grid; place-items: center; padding: 1.75rem;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 46ch; width: 100%; }
  .boxlbl {
    display: inline-block; border: 1px solid var(--ink); padding: .3rem .55rem;
    font-family: var(--mono); font-size: .6875rem; letter-spacing: .12em; text-transform: uppercase;
  }
  h1 {
    font-family: var(--display); font-weight: 700; text-transform: uppercase;
    font-size: clamp(2.4rem, 8vw, 4rem); line-height: .9; letter-spacing: -.005em;
    margin: 1rem 0 .75rem;
  }
  p { color: var(--muted); margin: 0 0 1.75rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .55rem; }
  a.btn {
    display: inline-block; font-family: var(--mono); font-size: .75rem;
    letter-spacing: .1em; text-transform: uppercase; text-decoration: none;
    padding: .8rem 1.2rem; background: var(--ink); color: var(--paper);
    border: 1px solid var(--ink); transition: background .16s ease, color .16s ease;
  }
  a.btn:hover { background: var(--blue); border-color: var(--blue); }
  a.btn.o { background: transparent; color: var(--ink); }
  a.btn.o:hover { background: var(--ink); color: var(--paper); }
  a.btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  .rule { margin-top: 2.25rem; padding-top: .875rem; border-top: 1px solid var(--hair);
          font-family: var(--mono); font-size: .6875rem; letter-spacing: .1em;
          text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
<script>
  // Carry the reader's chosen theme across pages, before first paint.
  try {
    if (localStorage.getItem('foreman-theme') === 'dark') {
      document.documentElement.dataset.theme = 'dark';
      document.querySelector('meta[name="theme-color"]').content = '#0A2444';
    }
  } catch (e) {}
</script>
<main>
  <span class="boxlbl">Error 404</span>
  <h1>That sheet isn't in the set.</h1>
  <p>The link may be old, or the address may have a typo in it. Everything else is still where it was.</p>
  <div class="actions">
    <a class="btn" href="/Foreman/">Back to Foreman</a>
    <a class="btn o" href="https://github.com/Turki-Sh/Foreman">The repository</a>
  </div>
  <p class="rule">Foreman · Blueprint no. 1 · T. Alshuaibi · MIT</p>
</main>
</body>
</html>
