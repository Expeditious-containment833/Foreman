name: Install path for an agent
description: A tool's skills directory is missing or wrong in AGENTS.md
title: "Install path: "
labels: ["install path"]
body:
  - type: input
    id: tool
    attributes:
      label: Tool and version
      placeholder: Windsurf 1.x
    validations: { required: true }
  - type: input
    id: path
    attributes:
      label: The path that actually works
    validations: { required: true }
  - type: textarea
    id: verified
    attributes:
      label: How you confirmed it loaded
      description: Ideally the agent answered "help me build my portfolio" with questions rather than code.
    validations: { required: true }
