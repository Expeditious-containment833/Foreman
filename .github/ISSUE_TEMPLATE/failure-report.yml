name: A failure Foreman did not catch
description: Your build broke and the playbook never asked the question that would have prevented it
title: "Missed: "
labels: ["failure mode"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most useful thing you can send. If it becomes a gate, a
        constraint in the brief, or a failure mode, you are credited in the changelog.
  - type: input
    id: building
    attributes:
      label: What were you building
      placeholder: A portfolio for a robotics PhD application
    validations: { required: true }
  - type: dropdown
    id: phase
    attributes:
      label: Where were you
      options:
        - Phase 0, orient
        - Phase 1, decide
        - Phase 2, lock the visual system
        - Phase 3, write the brief
        - Phase 4, handoff and iterate
        - Phase 5 or 6, verify and ship
        - Phase 7, index
        - After shipping
    validations: { required: true }
  - type: textarea
    id: broke
    attributes:
      label: What broke
    validations: { required: true }
  - type: textarea
    id: question
    attributes:
      label: What question would have prevented it
      description: This line is the contribution.
    validations: { required: true }
  - type: input
    id: agent
    attributes:
      label: Which agent were you running
      placeholder: Claude Code, Cursor, Codex, something else
